[workspace]
resolver = "3"
members = [
    "crates/mcode-core",
    "crates/mcode-config",
    "crates/mcode-provider-api",
    "crates/mcode-providers",
    "crates/mcode-tools",
    "crates/mcode-agent",
    "crates/mcode-plugin-api",
    "crates/mcode-plugin-host",
    "crates/mcode-render",
    "crates/mcode-tui",
    "crates/mcode-cli",
    "crates/mcode-desktop",
    "crates/mcode",
]
[workspace.package]
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"

# Single source of truth for shared dependency versions.
# Crates opt in via `dep.workspace = true` and may add features locally.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
async-trait = "0.1"
schemars = "1"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1.9"
anyhow = "1"
reqwest = { version = "0.13", features = ["stream"] }
futures-util = "0.3"
bytes = "1"
tokio-util = "0.7"
globset = "0.4"
ignore = "0.4"
# ripgrep's search core, linked in-process without an external executable.
grep-searcher = "0.1"
grep-regex = "0.1"
grep-matcher = "0.1"
regex = "1"
aho-corasick = "1"
memchr = "2"
jsonschema = { version = "0.52", default-features = false }
tempfile = "3"
blake3 = "1"
libc = "0.2"
rustix = "1"
windows-sys = "0.61"
junction = { version = "2", default-features = false }
sha2 = "0.11"
fs2 = "0.4"
getrandom = "0.4"
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }
clap = { version = "4", features = ["derive", "env"] }
assert_cmd = "2"
predicates = "3"
ratatui = { version = "0.30", default-features = false }
crossterm = { version = "0.29", default-features = false, features = ["events", "windows"] }
unicode-width = "0.2"
unicode-segmentation = "1"
semver = { version = "1", features = ["serde"] }
syn = { version = "2", features = ["full", "visit"] }
wasmtime = { version = "48.0.1", default-features = false, features = [
    "std",
    "runtime",
    "component-model",
    # Required for store-aware async Host bindings; guest concurrency stays disabled.
    "component-model-async",
    "cranelift",
] }
wat = "1.258.0"
# tree-sitter 0.25.10: Parser::set_language(&Language), Query::new(&Language, &str),
# QueryCursor::matches + StreamingIterator. Grammar crates export LanguageFn via
# LANGUAGE / LANGUAGE_TYPESCRIPT / LANGUAGE_TSX; pin exact so ABI stays compatible.
tree-sitter = "=0.25.10"
tree-sitter-rust = "=0.24.2"
tree-sitter-javascript = "=0.25.0"
tree-sitter-typescript = "=0.23.2"
tree-sitter-python = "=0.25.0"
tree-sitter-go = "=0.25.0"
tree-sitter-java = "=0.23.5"
tree-sitter-c = "=0.24.2"
tree-sitter-cpp = "=0.23.4"
tree-sitter-c-sharp = "=0.23.5"
tree-sitter-json = "=0.24.8"
