[package]
name = "mcode-desktop"
description = "GPUI desktop frontend for MCode"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
gpui-kit = "0.6"
mcode-catalog = { path = "../mcode-catalog" }
mcode-config = { path = "../mcode-config" }
mcode-core = { path = "../mcode-core" }
mcode-providers = { path = "../mcode-providers" }
mcode-provider-api = { path = "../mcode-provider-api" }
mcode-session = { path = "../mcode-session" }
mcode-web = { path = "../mcode-web" }
mcode-mcp = { path = "../mcode-mcp" }
mcode-agent = { path = "../mcode-agent" }
mcode-tools = { path = "../mcode-tools" }
mcode-updates = { path = "../mcode-updates" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
async-trait.workspace = true
jsonschema.workspace = true

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[[bin]]
name = "mcode-desktop"
path = "src/main.rs"
