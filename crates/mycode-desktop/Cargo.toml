[package]
name = "mycode-desktop"
description = "GPUI desktop frontend for MYCode"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
gpui-kit = "0.6"
mycode-app = { path = "../mycode-app" }
mycode-config = { path = "../mycode-config" }
mycode-providers = { path = "../mycode-providers" }
tokio = { workspace = true, features = ["sync"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[[bin]]
name = "mycode-desktop"
path = "src/main.rs"
