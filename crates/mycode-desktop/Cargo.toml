[package]
name = "mycode-desktop"
description = "GPUI desktop frontend for MYCode"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
gpui-kit = "0.6"
mycode-config = { path = "../mycode-config" }
mycode-core = { path = "../mycode-core" }
mycode-providers = { path = "../mycode-providers" }
mycode-web = { path = "../mycode-web" }
mycode-mcp = { path = "../mycode-mcp" }
mycode-agent = { path = "../mycode-agent" }
mycode-tools = { path = "../mycode-tools" }
mycode-updates = { path = "../mycode-updates" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
async-trait.workspace = true
jsonschema.workspace = true

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[[bin]]
name = "mycode-desktop"
path = "src/main.rs"
