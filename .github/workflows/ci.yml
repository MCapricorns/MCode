# Product CI: rustfmt, clippy -D warnings, and tests on the native
# product runners:
#   windows-latest  -> x86_64-pc-windows-msvc
#   macos-latest    -> aarch64-apple-darwin
#
# Linux and Intel macOS are not product targets.
#
# The core stack (the workspace's default members) and mycode-desktop (the
# gpui dependency tree) run as separate jobs so neither waits on the other.
#
# Privileged FS fixtures stay #[ignore]. This workflow does not set
# MYCODE_PRIVILEGED_FS_TESTS and does not pass --ignored; those tests
# require a host that can actually deny mode-000 opens.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  core:
    name: core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            host: x86_64-pc-windows-msvc
          - os: macos-latest
            host: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v5

      - name: Rust toolchain
        run: |
          rustup show
          rustup component add rustfmt clippy

      - name: Confirm native host triple
        shell: bash
        run: |
          host=$(rustc -vV | awk '/^host:/{print $2}')
          echo "rustc host=${host} expected=${{ matrix.host }}"
          test "${host}" = "${{ matrix.host }}"

      # Formats every workspace member, including mycode-desktop.
      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: >
          cargo clippy -p mycode-core -p mycode-config -p mycode-providers
          -p mycode-tools -p mycode-agent -p mycode-app
          --all-targets --locked -- -D warnings

      - name: cargo test
        run: >
          cargo test -p mycode-core -p mycode-config -p mycode-providers
          -p mycode-tools -p mycode-agent -p mycode-app --locked

  desktop:
    name: desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            host: x86_64-pc-windows-msvc
          - os: macos-latest
            host: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v5

      - name: Rust toolchain
        run: |
          rustup show
          rustup component add clippy

      - name: Confirm native host triple
        shell: bash
        run: |
          host=$(rustc -vV | awk '/^host:/{print $2}')
          echo "rustc host=${host} expected=${{ matrix.host }}"
          test "${host}" = "${{ matrix.host }}"

      - name: cargo clippy
        run: cargo clippy -p mycode-desktop --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test -p mycode-desktop --locked
