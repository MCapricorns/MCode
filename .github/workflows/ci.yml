# Single workflow for the product:
#
# 1. push/PR quality gate — rustfmt + clippy -D warnings on the native
#    product runners (windows-latest -> x86_64-pc-windows-msvc,
#    macos-latest -> aarch64-apple-darwin). No test suites exist.
#
# 2. release (manual) — triggered via workflow_dispatch with `tag` and
#    hand-written `notes`; builds both product targets and attaches the
#    zips to the GitHub Release for that tag. The release body is the
#    `notes` input verbatim; nothing is auto-generated.
#
# Assets produced per release:
#   mycode-desktop-<tag>-x86_64-pc-windows-msvc.zip      (+ .sha256)
#   mycode-desktop-<tag>-aarch64-apple-darwin.zip        (+ .sha256)

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v0.4.7"
        required: true
        type: string
      notes:
        description: "Hand-written release notes (release body)"
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  core:
    if: github.event_name != 'workflow_dispatch'
    name: core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            host: x86_64-pc-windows-msvc
          - os: macos-latest
            host: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v5

      - name: Rust toolchain
        run: rustup component add rustfmt clippy

      - name: Confirm native host triple
        shell: bash
        run: |
          host=$(rustc -vV | awk '/^host:/{print $2}')
          echo "rustc host=${host} expected=${{ matrix.host }}"
          test "${host}" = "${{ matrix.host }}"

      # Formats every workspace member, including mycode-desktop.
      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: >
          cargo clippy -p mycode-core -p mycode-config -p mycode-providers
          -p mycode-tools -p mycode-agent -p mycode-app
          --all-targets --locked -- -D warnings

  desktop:
    if: github.event_name != 'workflow_dispatch'
    name: desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            host: x86_64-pc-windows-msvc
          - os: macos-latest
            host: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v5

      - name: Rust toolchain
        run: rustup component add clippy

      - name: Confirm native host triple
        shell: bash
        run: |
          host=$(rustc -vV | awk '/^host:/{print $2}')
          echo "rustc host=${host} expected=${{ matrix.host }}"
          test "${host}" = "${{ matrix.host }}"

      - name: cargo clippy
        run: cargo clippy -p mycode-desktop --all-targets --locked -- -D warnings

  release-build:
    if: github.event_name == 'workflow_dispatch'
    name: release-build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: mycode-desktop.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: mycode-desktop
    steps:
      - uses: actions/checkout@v5
        with:
          # The tag must exist before dispatch; check it out so the
          # binaries match the released commit exactly.
          ref: ${{ inputs.tag }}

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked -p mycode-desktop --target ${{ matrix.target }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag }}"
          $stage = "mycode-desktop-$tag-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" "$stage/"
          Copy-Item README.md "$stage/" -ErrorAction SilentlyContinue
          Copy-Item LICENSE "$stage/" -ErrorAction SilentlyContinue
          $zip = "mycode-desktop-$tag-${{ matrix.target }}.zip"
          Compress-Archive -Path $stage -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Out-File -Encoding ascii "$zip.sha256"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          tag="${{ inputs.tag }}"
          stage="mycode-desktop-$tag-${{ matrix.target }}"
          mkdir -p "$stage"
          chmod +x "target/${{ matrix.target }}/release/${{ matrix.binary }}"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "$stage/"
          cp README.md "$stage/" 2>/dev/null || true
          cp LICENSE "$stage/" 2>/dev/null || true
          zip="mycode-desktop-$tag-${{ matrix.target }}.zip"
          zip -r "$zip" "$stage"
          hash=$(shasum -a 256 "$zip" | awk '{print $1}')
          printf '%s  %s\n' "$hash" "$zip" > "$zip.sha256"

      - name: Upload assets
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            *.zip
            *.zip.sha256
          retention-days: 3
          if-no-files-found: error

  release-publish:
    if: github.event_name == 'workflow_dispatch'
    needs: [release-build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}

      - name: Verify tag matches workspace version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          echo "tag=${{ inputs.tag }} workspace=${version}"
          test "${{ inputs.tag }}" = "v${version}"

      - name: Download assets
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Attach assets to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          body: ${{ inputs.notes }}
          files: |
            dist/*.zip
            dist/*.zip.sha256
          generate_release_notes: false
