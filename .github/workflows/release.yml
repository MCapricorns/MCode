# Release builds: Windows and macOS executables attached to the GitHub
# Release. Runs on `v*` tags.
#
# Assets produced per tag:
#   mcode-desktop-<tag>-x86_64-pc-windows-msvc.zip      (+ .sha256)
#   mcode-desktop-<tag>-aarch64-apple-darwin.zip        (+ .sha256)
#   mcode-desktop-<tag>-x86_64-apple-darwin.zip         (+ .sha256)
#
# Each archive contains the bare application binary so the in-app updater
# can swap it in place (mcode-updates::apply_and_restart).

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: mcode-desktop.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: mcode-desktop
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: mcode-desktop
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked -p mcode-desktop --target ${{ matrix.target }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $stage = "mcode-desktop-$tag-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" "$stage/"
          Copy-Item README.md "$stage/" -ErrorAction SilentlyContinue
          Copy-Item LICENSE "$stage/" -ErrorAction SilentlyContinue
          $zip = "mcode-desktop-$tag-${{ matrix.target }}.zip"
          Compress-Archive -Path $stage -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Out-File -Encoding ascii "$zip.sha256"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          tag="${{ github.ref_name }}"
          stage="mcode-desktop-$tag-${{ matrix.target }}"
          mkdir -p "$stage"
          chmod +x "target/${{ matrix.target }}/release/${{ matrix.binary }}"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "$stage/"
          cp README.md "$stage/" 2>/dev/null || true
          cp LICENSE "$stage/" 2>/dev/null || true
          zip="mcode-desktop-$tag-${{ matrix.target }}.zip"
          zip -r "$zip" "$stage"
          hash=$(shasum -a 256 "$zip" | awk '{print $1}')
          printf '%s  %s\n' "$hash" "$zip" > "$zip.sha256"

      - name: Attach assets to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.zip
            *.zip.sha256
          generate_release_notes: true
